name: checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Site must be reproducible from the evidence JSON
        run: python scripts/build_executive.py && git diff --exit-code -- docs/
      - name: Site contract
        run: python scripts/check_site.py
      - run: python -m pytest -q
