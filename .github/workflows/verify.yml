name: Verify evidence and shared metric
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore pinned shared code, without competition data
        run: PYTHONPATH=src python -c 'from gems_project.template import ensure_template; print(ensure_template())'
      - run: python -m pytest -q
      - run: python scripts/build_site.py && python scripts/check_site.py
      - name: Require committed site to match its evidence
        run: git diff --exit-code -- docs
      - name: Inspect public leaderboard page shape
        run: python .github/scripts/inspect_leaderboard.py
