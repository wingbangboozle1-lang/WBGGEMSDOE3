name: Scheduled source identity audit
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/refresh_upstream.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-identity-audit
          path: evidence/latest-upstream-check.json
